name: flutter_core_project
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.8+17

environment:
  sdk: '>=3.1.4 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  #State Management
  bloc: ^8.1.1
  #comparing dart objects
  equatable: ^2.0.5
  repository:

  cupertino_icons: ^1.0.2
  http: ^0.13.5
  shared_preferences: ^2.0.6
  flutter_svg: ^2.0.9
  flutter_bloc:
  hydrated_bloc:
  path_provider:
  dio:
  #make request to api
  retrofit:

  json_annotation:
  json_serializable:

  flutter_dotenv:

  pretty_dio_logger:
  #Service locator
  get_it:
  #Date format
  intl:
  #Database
  floor:
  #Hooks
  flutter_hooks:
  #cached image
  cached_network_image:
  #Render exam question/answer HTML
  flutter_html: ^3.0.0-beta.2
  #Network connectivity
  connectivity_plus: ^5.0.0
  # QR scanner for THP Festival guest check-in (Flutter 3.19 / Dart 3.3 compatible)
  mobile_scanner: 5.1.1
  # Store Festival tokens and remembered login credentials securely.
  flutter_secure_storage: 9.2.4

  # Firebase — versions compatible with Flutter 3.19 / Dart 3.3
  firebase_core: ^2.32.0
  firebase_messaging: ^14.9.4
  firebase_analytics: ^10.10.7
  firebase_crashlytics: ^3.5.7
  flutter_local_notifications: ^16.3.3
  flutter_native_splash: ^2.4.0
  shimmer: ^3.0.0
  timezone: ^0.9.2
  url_launcher:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  json_serializable:
  build_runner:
  retrofit_generator:

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/vectors/
    - assets/fonts/
    - lib/l10n/
    - .env.dev
    - .env.prod

  fonts:
    # Be Vietnam Pro — hỗ trợ đầy đủ tiếng Việt & tiếng Anh
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Light.ttf
          weight: 300
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-Italic.ttf
          style: italic
    # Satoshi — giữ lại để không bị lỗi nếu có chỗ còn dùng
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Black.ttf
          weight: 900
        - asset: assets/fonts/Satoshi-Bold.ttf
          weight: 600
        - asset: assets/fonts/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi-Regular.ttf
          weight: 400
        - asset: assets/fonts/Satoshi-Light.ttf
          weight: 300

# ─── Native Splash Screen ───────────────────────────────────────────────────
# Sau khi thay đổi config này, chạy: dart run flutter_native_splash:create
flutter_native_splash:
  # Màu nền trắng — khớp với SplashPage Flutter
  color: "#FFFFFF"
  color_dark: "#FFFFFF"

  # Logo splash riêng 432px, giữ đúng tỉ lệ và không dùng ảnh launcher 192px.
  image: assets/images/splash_logo_regular.png
  image_dark: assets/images/splash_logo_regular.png

  # Hiển thị logo ở giữa màn hình, không scale lên đầy màn hình
  android_gravity: center
  ios_content_mode: center

  # Tắt fullscreen (giữ status bar bình thường)
  fullscreen: false

  # Android 12+ Splash API
  # Ảnh 1152px có artwork 572x592px nằm trọn trong safe-zone Android 12,
  # nên system mask không thể cắt các cung ngoài của logo.
  android_12:
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
    image: assets/images/splash_logo_android12.png
    image_dark: assets/images/splash_logo_android12.png

  # Splash web không nằm trong phạm vi app mobile.
  web: false

#    flutter build appbundle --flavor prod -t lib/main_prod.dart
